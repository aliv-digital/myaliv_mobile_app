name: myaliv_mobile_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.1+8

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.4
  go_router: ^17.2.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  fluttertoast: ^9.0.0
  equatable: ^2.0.8
  country_picker: ^2.0.27
  country_pickers: ^3.0.1
  flutter_svg: ^2.2.4
  iconsax_plus: ^1.0.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  flutter_advanced_switch: ^3.1.0
  url_launcher: ^6.3.2
  table_calendar: ^3.2.0
  dropdown_button2: ^3.0.0
  animated_toggle_switch: ^0.8.7
  internet_connection_checker_plus: ^2.9.1+2
  phone_numbers_parser: ^9.0.21
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  core:
    path: packages/core
  flutter_html: ^3.0.0
  open_filex: ^4.5.0
  share_plus: ^10.0.0
  permission_handler: ^11.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: CircularPro
      fonts:
        - asset: assets/fonts/CircularPro-Bold.otf
        - asset: assets/fonts/CircularPro-Book.otf
          weight: 700

